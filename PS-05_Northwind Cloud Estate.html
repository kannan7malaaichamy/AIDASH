  <div class="grid2">${charts}</div>
  <div class="box" style="margin-bottom:16px"><h3>Definitions</h3><table><tbody>${IND.map(i=>`<tr><td><b>${i.name}</b></td><td>${i.def}</td><td class="n">Today ${i.f(i.base)}</td><td class="n">Day 90: ${i.f(i.tgt[2])}</td></tr>`).join('')}</tbody></table>
    <p class="sub" style="margin-top:8px">Reliability guardrails, tracked next to the indicators and not traded against them: no Tier 1 SLO breach caused by a platform change, platform release change failure rate at most 10%, rollback within 15 minutes, portal and pipelines available 99.5% in business hours.</p></div>

  <div class="pb"><span class="no">C</span><h2>Owners and support model</h2></div>
  <div class="grid2">
    <div class="box"><h3>Owners</h3><div class="scroll"><table><thead><tr><th>Role</th><th>From</th><th>Accountable for</th><th>Time</th></tr></thead><tbody>${owners.map(o=>`<tr><td><b>${o[0]}</b></td><td>${o[1]}</td><td>${o[2]}</td><td>${o[3]}</td></tr>`).join('')}</tbody></table></div></div>
    <div class="box"><h3>Support model</h3><div class="scroll"><table><thead><tr><th>Channel</th><th>When</th><th>Response</th><th>Used for</th></tr></thead><tbody>${sup.map(o=>`<tr><td><b>${o[0]}</b></td><td>${o[1]}</td><td>${o[2]}</td><td>${o[3]}</td></tr>`).join('')}</tbody></table></div></div>
  </div>

  <div class="pb"><span class="no">D</span><h2>Standards and change controls</h2></div>
  <div class="grid2">
    <div class="box"><h3>Standards</h3><table><tbody>${std.map(s=>`<tr><td><b>${s[0]}</b></td><td>${s[1]}</td></tr>`).join('')}</tbody></table></div>
    <div class="box"><h3>Change controls for platform releases</h3><div class="scroll"><table><thead><tr><th>Class</th><th>Example</th><th>Approver</th><th>Rollout</th><th>Lead time</th></tr></thead><tbody>${chg.map(c=>`<tr><td><b>${c[0]}</b></td><td>${c[1]}</td><td>${c[2]}</td><td>${c[3]}</td><td>${c[4]}</td></tr>`).join('')}</tbody></table></div>
      <p class="sub" style="margin-top:8px">No platform changes during an adopter's Tier 1 release window. Freeze from 24 December to 2 January, except emergency fixes.</p></div>
  </div>

  <div class="pb"><span class="no">E</span><h2>Risks</h2></div>
  <div class="box"><table><thead><tr><th>Risk</th><th>Response</th></tr></thead><tbody>${risks.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td></tr>`).join('')}</tbody></table></div>`;
  const dash=()=>{
    const c=CPS[planCp],cp=planCp;
    const tiles=IND.map(i=>{const v=indAt(i,cp),t=i.tgt[2],prog=i.low?(i.base-v)/(i.base-t):(v-i.base)/(t-i.base);
      return `<div><div class="nm">${i.name}</div><b class="v">${i.f(v)}</b><small>${i.unit}</small><div class="pg"><i style="width:${Math.max(0,Math.min(1,prog))*100}%"></i></div><small>Today ${i.f(i.base)} · Day 90 target ${i.f(t)}</small>${cp?`<small>Adjust the plan if ${i.low?'above':'below'} ${i.f(i.trip[cp-1])}</small>`:''}</div>`}).join('');
    const body=cp?`<div class="grid2" style="margin:0"><div><h3>${c.title}</h3><p class="sub"><b>Decides:</b> ${c.who}<br><b>Date:</b> ${c.date}</p>
      <h3>Evidence pack</h3><ul class="crit" style="padding-left:18px;margin:0 0 8px">${IND.map(i=>`<li>${i.name} ${i.low?'at most':'at least'} <b>${i.f(i.tgt[cp-1])}</b></li>`).join('')}${c.non.map(n=>`<li>${n}</li>`).join('')}</ul></div>
      <div><h3>Options on the day</h3><ol style="padding-left:18px;margin:0 0 8px">${c.opts.map(o=>`<li>${o}</li>`).join('')}</ol>
      <p class="sub">If two or more indicators are past their adjust line, the default option is to hold scope and fix before adding teams.</p></div></div>`:`<p class="sub">Baseline before the pilot starts. Select Day 30, Day 60 or Day 90 to see the target values, the point at which the plan is adjusted, and the decision to be made.</p>`;
    $('dash').innerHTML=`<div class="ind">${tiles}</div>${body}`;
    $('cpb').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.cp===planCp));
  };
  $('cpb').querySelectorAll('button').forEach(b=>b.onclick=()=>{planCp=+b.dataset.cp;dash()});
  dash();
}

/* ---------- routing ---------- */
const VIEWS={overview:renderOverview,business:renderBusiness,application:renderApplication,technology:renderTechnology,deployment:renderDeployment,metrics:renderMetrics,platform:renderPlatform,brief:renderBrief,plan:renderPlan};
const done={};
function show(v){
  if(!VIEWS[v])v='overview';
  if(!done[v]){VIEWS[v]();done[v]=1}
  document.querySelectorAll('.view').forEach(s=>s.hidden=s.id!=='v-'+v);
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===v));
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{location.hash=b.dataset.v});
addEventListener('hashchange',()=>show(location.hash.slice(1)));
show(location.hash.slice(1));
</script>

</body></html>
