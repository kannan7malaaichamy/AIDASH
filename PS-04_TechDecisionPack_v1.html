<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS04 Tech Decision Pack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05060a; --s1:rgba(255,255,255,.035); --s2:rgba(255,255,255,.06); --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --tx:#e8ebf2; --tx2:#b4bccb; --mu:#7d879b;
  --cyan:#22d3ee; --blue:#60a5fa; --amber:#fbbf24; --grey:#a3adbf; --teal:#2dd4bf; --pink:#f472b6;
  --ai:#a78bfa; --human:#34d399; --auto:#fb7185; --pain:#fb923c; --good:#34d399; --bad:#fb7185;
}
:root[data-theme="light"]{ --bg:#05060a; }
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{background:
  radial-gradient(900px 600px at 85% -10%, rgba(34,211,238,.10), transparent 60%),
  radial-gradient(800px 600px at -10% 30%, rgba(167,139,250,.10), transparent 60%),
  radial-gradient(700px 500px at 60% 110%, rgba(52,211,153,.07), transparent 60%), var(--bg);background-attachment:fixed}
a{color:var(--cyan)}
/* rail */
.rail{position:fixed;left:0;top:0;bottom:0;width:250px;padding:26px 18px;border-right:1px solid var(--line);background:rgba(5,6,10,.75);backdrop-filter:blur(12px);z-index:20;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.brand{font-weight:900;letter-spacing:-.02em;font-size:15px;margin-bottom:2px}
.brand span{background:linear-gradient(90deg,var(--cyan),var(--ai));-webkit-background-clip:text;background-clip:text;color:transparent}
.brandsub{font-size:11px;color:var(--mu);margin-bottom:18px}
.chap{display:flex;gap:10px;align-items:flex-start;padding:7px 8px;border-radius:10px;cursor:pointer;color:var(--mu);font-size:12.5px;line-height:1.3;border:1px solid transparent;transition:.25s}
.chap:hover{background:var(--s1);color:var(--tx2)}
.chap.on{background:var(--s2);color:var(--tx);border-color:var(--line2)}
.chap .d{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 10.5px "JetBrains Mono",monospace;border:1px solid var(--line2);color:var(--tx2)}
.chap.on .d{background:linear-gradient(135deg,var(--cyan),var(--ai));color:#05060a;border-color:transparent}
.grp{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin:12px 8px 4px}
.prog{height:3px;background:var(--line);border-radius:3px;margin:14px 6px 10px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--ai));transition:width .3s}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:14px}
.tb{background:var(--s1);border:1px solid var(--line2);color:var(--tx2);border-radius:8px;padding:6px 9px;font:600 11.5px Inter,sans-serif;cursor:pointer}
.tb:hover{color:var(--tx);border-color:var(--cyan)}
.tb.on{color:#05060a;background:var(--cyan);border-color:var(--cyan)}
.keys{font-size:10.5px;color:var(--mu);margin-top:8px}
/* main */
main{margin-left:250px}
section.ch{min-height:100vh;padding:64px 56px 48px;border-bottom:1px solid var(--line);position:relative}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.eyebrow{display:flex;gap:12px;align-items:center;font:600 11.5px "JetBrains Mono",monospace;color:var(--mu);letter-spacing:.06em;text-transform:uppercase}
.eyebrow .pn{color:var(--cyan)}
.eyebrow .dl{padding:2px 8px;border:1px solid var(--line2);border-radius:20px}
h2.title{font-size:clamp(24px,3vw,36px);line-height:1.15;font-weight:900;letter-spacing:-.025em;margin:0;max-width:1050px}
h2.title em{font-style:normal;background:linear-gradient(90deg,var(--cyan),var(--ai));-webkit-background-clip:text;background-clip:text;color:transparent}
h3.h{margin:0 0 10px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx2);font-weight:700;display:flex;align-items:center;gap:8px}
h3.h::before{content:"";width:14px;height:2px;background:var(--cyan);border-radius:2px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.g6{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
/* flow (SVG cross-functional) */
.flowbox{overflow-x:auto;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.015)}
.flowbox svg{display:block;min-width:1000px;width:100%;height:auto}
.fn{width:100%;height:100%;box-sizing:border-box;border-radius:9px;padding:5px 7px;border:1.5px solid rgba(255,255,255,.22);background:#11141c;color:var(--tx2);font:500 10px/1.25 Inter,sans-serif;display:flex;flex-direction:column;gap:1px;overflow:hidden;transition:opacity .3s}
.fn b{font-size:11px;color:var(--tx);font-weight:700}
.fn .tm{margin-top:auto;align-self:flex-start;font:700 9.5px "JetBrains Mono",monospace;color:#05060a;background:var(--amber);border-radius:4px;padding:1px 5px}
.fn.pain{border-color:#fb923c;background:#22160d} .fn.ai{border-color:#a78bfa;background:#1a1530}
.fn.human{border-color:#34d399;background:#0d1f17} .fn.auto{border-color:#fb7185;background:#231117}
.fn .bdg{display:inline-block;font:800 9px "JetBrains Mono",monospace;color:#05060a;background:#a78bfa;border-radius:3px;padding:0 3px;margin-right:3px}
.fn.pain .bdg{background:#fb923c}
.el{display:flex;justify-content:center;align-items:center;width:100%;height:100%}
.el span{font:700 9.5px "JetBrains Mono",monospace;padding:1px 6px;border-radius:10px;background:#05060a;border:1px solid;white-space:nowrap}
.dimmed{opacity:.12}
.fsum{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.fsum span{font:700 11px "JetBrains Mono",monospace;padding:5px 10px;border-radius:20px;border:1px solid var(--line2);color:var(--tx2)}
.fsum b{color:var(--tx)}
.s73{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}
p,li{color:var(--tx2);font-size:14px;line-height:1.5}
ul.b{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.small{font-size:12px;color:var(--mu);line-height:1.5}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}
/* tags */
.tag{display:inline-block;font:700 9.5px "JetBrains Mono",monospace;letter-spacing:.03em;border-radius:4px;padding:2px 6px;margin-left:4px;vertical-align:1px;white-space:nowrap;border:1px solid}
.tag.G{color:var(--blue);border-color:rgba(96,165,250,.4);background:rgba(96,165,250,.08)}
.tag.A{color:var(--amber);border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.08)}
.tag.S{color:var(--grey);border-color:rgba(163,173,191,.35);background:rgba(163,173,191,.07)}
.tag.C{color:var(--teal);border-color:rgba(45,212,191,.4);background:rgba(45,212,191,.08)}
.tag.I{color:var(--pink);border-color:rgba(244,114,182,.4);background:rgba(244,114,182,.08)}
.synth{align-self:flex-start;font:700 10.5px "JetBrains Mono",monospace;letter-spacing:.08em;color:var(--grey);border:1px dashed rgba(163,173,191,.5);padding:4px 10px;border-radius:6px}
/* hero */
.rec{font-size:clamp(17px,1.8vw,22px);line-height:1.4;font-weight:600;color:var(--tx);padding:20px 24px;border-radius:18px;background:linear-gradient(135deg,rgba(34,211,238,.12),rgba(167,139,250,.12));border:1px solid rgba(34,211,238,.3)}
.kpi{position:relative;overflow:hidden;border-radius:18px;padding:20px 22px;background:var(--s1);border:1px solid var(--line)}
.kpi::after{content:"";position:absolute;inset:auto -40px -60px auto;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.18),transparent 70%)}
.kpi .v{font-size:44px;font-weight:900;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.kpi .v .arrow{color:var(--mu);font-weight:400;margin:0 6px}
.kpi .v .to{background:linear-gradient(90deg,var(--cyan),var(--human));-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi .l{font-size:13px;color:var(--tx2);margin-top:10px;line-height:1.4}
.line{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.line .k{font:700 11px "JetBrains Mono",monospace;letter-spacing:.1em;color:var(--cyan);text-transform:uppercase}
.line .t{font-size:14.5px;color:var(--tx2);line-height:1.45}
.mini{position:relative;height:46px;margin:6px 56px 0}
.mini .trk{position:absolute;left:0;right:0;top:20px;height:4px;border-radius:4px;background:linear-gradient(90deg,rgba(34,211,238,.5),rgba(167,139,250,.5),rgba(52,211,153,.5))}
.mini .m{position:absolute;top:13px;transform:translateX(-50%);text-align:center}
.mini .m i{display:block;width:16px;height:16px;margin:0 auto;transform:rotate(45deg);background:var(--bg);border:2px solid var(--cyan)}
.mini .m span{display:block;font:600 10.5px "JetBrains Mono",monospace;color:var(--tx2);margin-top:6px;white-space:nowrap}
/* tables */
.tw{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table.t{border-collapse:collapse;width:100%;font-size:12.5px;line-height:1.4}
table.t th{background:rgba(255,255,255,.05);color:var(--cyan);text-align:left;padding:9px 10px;font:700 10.5px "JetBrains Mono",monospace;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--line2);vertical-align:bottom}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--tx2)}
table.t tr:last-child td{border-bottom:0}
table.t tr:hover td{background:rgba(255,255,255,.025)}
table.t td:first-child{color:var(--tx);font-weight:600}
table.t.xs{font-size:11.5px} table.t.xs td,table.t.xs th{padding:6px 8px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
/* tabs / segmented */
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:var(--s1);border:1px solid var(--line);flex-wrap:wrap}
.seg button{background:transparent;border:0;color:var(--tx2);font:600 12.5px Inter,sans-serif;padding:7px 14px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--tx);color:#05060a}
/* bars */
.bar{display:grid;grid-template-columns:200px 1fr 70px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.bar:last-child{border-bottom:0}
.bar .n{font-size:13px;color:var(--tx);line-height:1.3}
.bar .n small{display:block;color:var(--mu);font-size:11px}
.bars{display:flex;flex-direction:column;gap:5px}
.bt{display:flex;align-items:center;gap:8px;font:600 11px "JetBrains Mono",monospace;color:var(--tx2)}
.bt .f{display:inline-block;min-width:4px;height:12px;border-radius:6px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.bt .f.ai{background:linear-gradient(90deg,#7c3aed,var(--ai))}
.bt .f.no{background:linear-gradient(90deg,#334155,#64748b)}
.delta{font:800 15px "JetBrains Mono",monospace;text-align:right}
.delta.good{color:var(--good)} .delta.bad{color:var(--bad)}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mu);align-items:center}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
/* swimlane */
.swimbox{overflow-x:auto;border-radius:14px;border:1px solid var(--line)}
.swim{display:grid;grid-template-columns:128px repeat(7,minmax(118px,1fr));min-width:980px;font-size:11px;overflow:hidden}
.swim .hd{background:rgba(255,255,255,.05);color:var(--tx);font-weight:700;padding:9px 6px;text-align:center;position:relative;font-size:11.5px;border-bottom:1px solid var(--line2)}
.swim .hd.st:not(:last-child)::after{content:"›";position:absolute;right:-5px;top:4px;color:var(--cyan);z-index:2;font-size:18px}
.swim .ln{color:var(--tx2);font-weight:700;padding:8px 10px;display:flex;align-items:center;border-top:1px solid var(--line);font-size:11px;background:rgba(255,255,255,.02)}
.swim .cl{border-top:1px solid var(--line);border-left:1px dashed var(--line);padding:5px;min-height:50px;display:flex;flex-direction:column;gap:4px}
.nd{border-radius:8px;padding:6px 8px;line-height:1.3;border:1px solid var(--line2);background:rgba(255,255,255,.03);color:var(--tx2);transition:opacity .3s,filter .3s,box-shadow .3s}
.nd b{display:block;font-size:11px;color:var(--tx);margin-bottom:1px}
.nd.pain{border-color:rgba(251,146,60,.55);background:rgba(251,146,60,.09)}
.nd.ai{border-color:rgba(167,139,250,.6);background:rgba(167,139,250,.11)}
.nd.human{border-color:rgba(52,211,153,.55);background:rgba(52,211,153,.09)}
.nd.auto{border-color:rgba(251,113,133,.55);background:rgba(251,113,133,.09)}
.nd.dim{opacity:.16;filter:grayscale(1)}
.nd.glow{box-shadow:0 0 0 1px currentColor,0 0 22px rgba(167,139,250,.25)}
.badge{display:inline-block;font:800 9.5px "JetBrains Mono",monospace;color:#05060a;background:var(--ai);border-radius:4px;padding:0 4px;margin-right:4px}
.badge.p{background:var(--pain)}
.safe{border-radius:14px;padding:12px 16px;font-size:13px;color:var(--tx2);border:1px solid rgba(251,191,36,.35);background:rgba(251,191,36,.06)}
.safe b{color:var(--amber)}
/* options */
.opt{border-radius:18px;padding:18px;background:var(--s1);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;position:relative}
.opt.best{border-color:rgba(34,211,238,.6);background:linear-gradient(180deg,rgba(34,211,238,.08),rgba(167,139,250,.05));box-shadow:0 0 50px rgba(34,211,238,.08)}
.opt .nm{font-weight:800;font-size:16px;color:var(--tx)}
.opt .rib{position:absolute;top:-11px;right:16px;font:800 10px "JetBrains Mono",monospace;letter-spacing:.08em;background:var(--cyan);color:#05060a;padding:4px 9px;border-radius:20px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:8px;font-size:12.5px;color:var(--tx2);line-height:1.4}
.kv b{color:var(--mu);font:700 10px "JetBrains Mono",monospace;letter-spacing:.06em;text-transform:uppercase;padding-top:2px}
.slider{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center;font-size:11px;color:var(--mu)}
.slider .tr{position:relative;height:6px;border-radius:6px;background:linear-gradient(90deg,rgba(251,113,133,.35),rgba(52,211,153,.35))}
.slider .tr i{position:absolute;top:-4px;width:14px;height:14px;border-radius:50%;background:var(--tx);transform:translateX(-50%);box-shadow:0 0 10px rgba(255,255,255,.4)}
.slider .ends{display:flex;justify-content:space-between;font-size:9.5px;color:var(--mu);margin-top:3px}
.sh{border-radius:14px;padding:12px 14px;background:var(--s1);border:1px solid var(--line)}
.sh .r{font-weight:800;color:var(--tx);font-size:13px}
.sh .f{font-size:12px;color:var(--bad);margin:4px 0}
.sh .a{font-size:12px;color:var(--good)}
.stack{display:flex;height:28px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.stack div{display:grid;place-items:center;font:700 10px "JetBrains Mono",monospace;color:#05060a;overflow:hidden;white-space:nowrap}
.vbar{display:grid;grid-template-columns:150px 1fr 80px;gap:10px;align-items:center;font-size:12.5px;padding:5px 0}
.vbar .f{display:block;height:14px;border-radius:7px;transition:width 1s}
.big{font-size:42px;font-weight:900;letter-spacing:-.03em}
/* timeline */
.tl{position:relative;padding:8px 0 4px}
.tlrow{position:relative;height:34px;margin:4px 0;border-radius:8px;background:rgba(255,255,255,.02)}
.tlrow .lab{position:absolute;left:-118px;width:110px;text-align:right;top:9px;font:700 10px "JetBrains Mono",monospace;color:var(--mu);letter-spacing:.06em;text-transform:uppercase}
.band{position:absolute;top:4px;bottom:4px;border-radius:6px;display:flex;align-items:center;padding:0 8px;font:700 10.5px "JetBrains Mono",monospace;white-space:nowrap;overflow:hidden}
.pin{position:absolute;top:5px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.pin i{width:12px;height:12px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
.pin.g i{border-radius:2px;transform:rotate(45deg);background:var(--human);box-shadow:0 0 14px var(--human)}
.pin.r i{background:var(--ai);box-shadow:0 0 12px var(--ai)}
.pin span{font:600 9.5px "JetBrains Mono",monospace;color:var(--tx2);white-space:nowrap;margin-top:3px}
.axis{position:relative;height:20px;margin-top:4px}
.axis span{position:absolute;transform:translateX(-50%);font:600 10px "JetBrains Mono",monospace;color:var(--mu)}
.tlwrap{padding:0 54px 0 118px;overflow-x:auto;overflow-y:hidden}
.tlinner{min-width:760px}
.gate{border-radius:16px;padding:16px;border:1px solid rgba(52,211,153,.35);background:rgba(52,211,153,.05)}
.gate .d{font:800 12px "JetBrains Mono",monospace;color:var(--human);margin-bottom:8px}
.gate p{margin:4px 0;font-size:12.5px}
.gate .c{color:var(--good)} .gate .a{color:var(--amber)} .gate .s{color:var(--bad)}
/* team */
.team{border-radius:18px;padding:18px;background:var(--s1);border:1px solid var(--line)}
.team .nm{font-weight:800;font-size:16px}
.meter{height:8px;border-radius:8px;background:rgba(255,255,255,.07);overflow:hidden;margin:8px 0 4px}
.meter i{display:block;height:100%;border-radius:8px;transition:width 1.2s}
.pill{display:inline-block;font:700 10px "JetBrains Mono",monospace;border-radius:20px;padding:3px 9px;border:1px solid var(--line2);color:var(--tx2);margin:2px 4px 2px 0}
/* indicators */
.ind{border-radius:18px;padding:18px;background:var(--s1);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.ind .nm{font-weight:800;color:var(--tx);font-size:14.5px}
.ind .bt2{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px;letter-spacing:-.02em}
.ind .bt2 .b0{color:var(--tx2)} .ind .bt2 .b1{color:var(--human)}
.ind .meta{font-size:11.5px;color:var(--mu);line-height:1.45}
.ind .lead{align-self:flex-start;font:700 9.5px "JetBrains Mono",monospace;padding:2px 8px;border-radius:20px}
.ld{color:var(--cyan);border:1px solid rgba(34,211,238,.4)} .lg2{color:var(--amber);border:1px solid rgba(251,191,36,.4)}
.ask{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ask .dt{font:800 12px "JetBrains Mono",monospace;color:#05060a;background:var(--cyan);border-radius:8px;padding:6px 8px;text-align:center}
/* ai usage */
.flow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flow span{padding:8px 14px;border-radius:30px;border:1px solid var(--line2);font-weight:700;font-size:13px;color:var(--tx)}
.flow em{color:var(--cyan);font-style:normal}
.person{display:grid;grid-template-columns:52px 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#05060a;font-size:17px}
.person .who{font-weight:800;color:var(--tx);font-size:15px}
.person .role{font-size:11.5px;color:var(--mu)}
.person .ask2{font-size:13.5px;color:var(--tx2);margin-top:4px;line-height:1.45}
.person .fix{font-size:12.5px;color:var(--human);margin-top:4px}
.hi{color:var(--amber);font-weight:700}
/* notes */
.note{display:none;border-left:3px solid var(--ai);background:rgba(167,139,250,.07);padding:10px 14px;border-radius:0 10px 10px 0;font-size:13px;color:var(--tx2)}
.shownotes .note{display:block}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font:500 10.5px "JetBrains Mono",monospace;color:var(--mu);border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
pre.code{background:#0b0d14;color:#cbd5e1;border-radius:12px;border:1px solid var(--line);padding:12px 14px;font:11px/1.5 "JetBrains Mono",Consolas,monospace;overflow:auto;margin:0;white-space:pre;max-height:340px}

  .note{display:block}

<script>

const Table = ({head, rows, cls="", numCols=[]}) => html`<div className="tw"><table className=${"t "+cls}>
  <thead><tr>${head.map((h,i)=>html`<th key=${i} className=${numCols.includes(i)?"num":""}>${h}</th>`)}</tr></thead>

const download = (name, text, type="text/csv") => { const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); };
const copy = text => navigator.clipboard && navigator.clipboard.writeText(text);

function useInView(){
  const ref=useRef(null); const [v,setV]=useState(false);
  useEffect(()=>{ const el=ref.current; if(!el) return; let done=false, io=null;
    const stop=()=>{ done=true; window.removeEventListener("scroll",check); window.removeEventListener("resize",check); window.removeEventListener("beforeprint",show); io&&io.disconnect(); };
    const show=()=>{ if(!done){ setV(true); stop(); } };
    function check(){ const r=el.getBoundingClientRect(); if(r.top<window.innerHeight*0.95 && r.bottom>0) show(); }
    window.addEventListener("scroll",check,{passive:true}); window.addEventListener("resize",check); window.addEventListener("beforeprint",show);
    if("IntersectionObserver" in window){ io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting) show(); }),{threshold:.1}); io.observe(el); }
    const t=setTimeout(check,60);
    return ()=>{ clearTimeout(t); stop(); }; },[]);
  return [ref,v];
}
function R({children, d=0, cls=""}){ const [ref,v]=useInView(); return html`<div ref=${ref} className=${"reveal "+cls+(v?" in":"")} style=${{transitionDelay:d+"ms"}}>${children}</div>`; }
function Count({to, dec=0, pre="", suf=""}){
  const [ref,v]=useInView(); const [x,setX]=useState(0);
  useEffect(()=>{ if(!v) return; let raf, t0; const dur=1200;
    const step=t=>{ if(!t0) t0=t; const p=Math.min((t-t0)/dur,1); setX(to*(1-Math.pow(1-p,3))); if(p<1) raf=requestAnimationFrame(step); };
    raf=requestAnimationFrame(step); return ()=>cancelAnimationFrame(raf); },[v,to]);
  return html`<span ref=${ref}>${pre}${x.toFixed(dec)}${suf}</span>`;
}

/* ================= SVG cross-functional flow ================= */
const FW=1180, FLW=124, FHH=40, FLH=104, FNW=134, FNH=82;
const EC={flow:"#cbd5e1",handoff:"#22d3ee",loop:"#fb923c",ai:"#a78bfa",auto:"#fb7185"};
function Flow({g, filter="all", idp}){
  const cw=(FW-FLW)/7, H=FHH+g.lanes.length*FLH;
  const lt=l=>FHH+l*FLH, gx=c=>FLW+(c+1)*cw;
  const N={}; g.nodes.forEach(n=>{ const x=FLW+n.c*cw+(cw-FNW)/2, y=lt(n.l)+(FLH-FNH)/2; N[n.id]={...n,x,y,cx:x+FNW/2,cy:y+FNH/2}; });
  const route=e=>{ const a=N[e.f], b=N[e.t]; let d,lx,ly;
    if(e.r==="h"){ d=`M${a.x+FNW} ${a.cy} L${b.x-2} ${b.cy}`; lx=(a.x+FNW+b.x)/2; ly=a.cy-11; }
    else if(e.r==="v"){ const dn=b.l>a.l, x=a.cx+(e.dx||0); d=`M${x} ${dn?a.y+FNH:a.y} L${x} ${dn?b.y-2:b.y+FNH+2}`; lx=x; ly=dn?lt(a.l+1):lt(a.l); }
    else if(e.r==="g"){ const gg=gx(a.c), tx=b.c>a.c?b.x-2:b.x+FNW+2; d=`M${a.x+FNW} ${a.cy} L${gg} ${a.cy} L${gg} ${b.cy} L${tx} ${b.cy}`; lx=gg; ly=b.l>a.l?lt(a.l+1):lt(a.l); }
    else { const sx=a.cx-(e.dx||20), tx=b.cx+(e.tx||0), yb=lt(a.l)+FLH-3; d=`M${sx} ${a.y+FNH} L${sx} ${yb} L${tx} ${yb} L${tx} ${b.y+FNH+2}`; lx=(sx+tx)/2; ly=yb+3; }
    if(e.lb!==undefined && e.ly!==undefined) ly=lt(e.ly);
    return {d,lx,ly}; };
  const keepNode=n=>filter==="all"||n.k===filter;
  const keepEdge=e=>filter==="all"||(filter==="ai"&&e.k==="ai")||(filter==="human"&&(N[e.f].k==="human"||N[e.t].k==="human")&&e.k!=="ai")||(filter==="auto"&&(N[e.f].k==="auto"||N[e.t].k==="auto"));
  const mk=k=>`url(#${idp}-${k})`;
  return html`<div className="flowbox"><svg viewBox=${`0 0 ${FW} ${H}`} xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cross-functional flowchart">
    <defs>${Object.keys(EC).map(k=>html`<marker key=${k} id=${idp+"-"+k} viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill=${EC[k]}/></marker>`)}</defs>
    ${g.lanes.map((ln,i)=>html`<g key=${"l"+i}><rect x="0" y=${lt(i)} width=${FW} height=${FLH} fill=${i%2?"rgba(255,255,255,.025)":"rgba(255,255,255,.0)"}/>
      <line x1="0" x2=${FW} y1=${lt(i)} y2=${lt(i)} stroke="rgba(255,255,255,.08)"/>
      <foreignObject x="8" y=${lt(i)} width=${FLW-14} height=${FLH}><div style=${{height:"100%",display:"flex",alignItems:"center",font:"700 11px Inter",color:"#b4bccb",lineHeight:1.25}}>${ln}</div></foreignObject></g>`)}
    <line x1=${FLW} x2=${FLW} y1="0" y2=${H} stroke="rgba(255,255,255,.12)"/>
    ${STAGES.map((s,i)=>html`<g key=${"s"+i}><rect x=${FLW+i*cw+3} y="6" width=${cw-6} height="26" rx="13" fill="rgba(34,211,238,.10)" stroke="rgba(34,211,238,.35)"/>
      <text x=${FLW+i*cw+cw/2} y="23" textAnchor="middle" fill="#e8ebf2" style=${{font:"700 11.5px Inter"}}>${s}</text>
      ${i<6 && html`<path d=${`M${FLW+(i+1)*cw-4} 13 l7 6 l-7 6`} fill="none" stroke="#22d3ee" strokeWidth="2"/>`}
      ${i>0 && html`<line x1=${FLW+i*cw} x2=${FLW+i*cw} y1=${FHH} y2=${H} stroke="rgba(255,255,255,.05)" strokeDasharray="3 4"/>`}</g>`)}
    ${g.edges.map((e,i)=>{ const r=route(e); const k=e.k; const dim=!keepEdge(e);
      return html`<path key=${"e"+i} d=${r.d} fill="none" stroke=${EC[k]} strokeWidth=${k==="handoff"?2.4:2} strokeDasharray=${k==="loop"?"6 4":k==="ai"?"2 4":"none"} markerEnd=${mk(k)} strokeLinejoin="round" className=${dim?"dimmed":""}/>`; })}
    ${g.nodes.map(n=>{ const p=N[n.id]; return html`<foreignObject key=${n.id} x=${p.x} y=${p.y} width=${FNW} height=${FNH} className=${keepNode(n)?"":"dimmed"}>
      <div className=${"fn "+(n.k||"")}><b>${n.a && html`<span className="bdg">${n.a}</span>`}${n.t}</b><span>${n.s}</span>${n.tm && html`<span className="tm">⏱ ${n.tm}</span>`}</div></foreignObject>`; })}
    ${g.edges.filter(e=>e.lb).map((e,i)=>{ const r=route(e); const dim=!keepEdge(e);
      return html`<foreignObject key=${"lb"+i} x=${r.lx-80} y=${r.ly-9} width="160" height="18" className=${dim?"dimmed":""}><div className="el"><span style=${{color:EC[e.k],borderColor:EC[e.k]}}>${e.lb}</span></div></foreignObject>`; })}
  </svg></div>
  <div className="fsum">
    <span><b>${g.edges.filter(e=>e.k==="handoff").length}</b> handoffs between roles</span>
    <span><b>${g.edges.filter(e=>e.k==="handoff"&&(N[e.f].k==="auto"||N[e.t].k==="auto")).length}</b> of them automated</span>
    <span><b>${g.edges.filter(e=>e.k==="loop").length}</b> rework loop${g.edges.filter(e=>e.k==="loop").length===1?"":"s"}</span>
    ${g.edges.some(e=>e.k==="ai") && html`<span><b>${g.edges.filter(e=>e.k==="ai").length}</b> AI assists, each into a human owner</span>`}
    <span style=${{borderColor:"var(--amber)"}}>⏱ step times: ${g.timeNote}</span></div>
  <div className="lg" style=${{marginTop:"8px"}}>
    <span><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke=${EC.flow} strokeWidth="2"/></svg> flow within a role</span>
    <span><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke=${EC.handoff} strokeWidth="2.4"/></svg> handoff to another role</span>
    <span><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke=${EC.loop} strokeWidth="2" strokeDasharray="6 4"/></svg> rework loop</span>
    <span><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke=${EC.ai} strokeWidth="2" strokeDasharray="2 4"/></svg> AI assist</span>
    <span><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke=${EC.auto} strokeWidth="2"/></svg> automated check</span></div>`;
}

 timeNote:"ILLUSTRATIVE-SYNTHETIC (T1–T3) or ASSUMPTION; 9 person-days and 6 weeks GIVEN",
 nodes:[

 edges:[

const AF={lanes:["Product owner","AI assistant (approved tools)","Developers / code owners","QA","Pipeline (automation)","Security (AppSec)","Release manager"],
 timeNote:"targets are ASSUMPTION until Day-30 baselines replace them",
 nodes:[
  {id:"ai1",l:1,c:0,k:"ai",a:"A1",t:"Drafts stories & criteria",s:"Edge, security, non-functional"},
  {id:"r",l:0,c:0,k:"human",t:"✔ PO approves story",s:"Definition of ready",tm:"target 5.0 days"},
  {id:"d",l:2,c:1,t:"Design",s:"Unchanged",tm:"2 days"},
  {id:"ai2",l:1,c:2,k:"ai",a:"A2",t:"Suggests code",s:"Approved repos only"},
  {id:"c",l:2,c:2,k:"human",t:"Developer owns change",s:"AI label · ≤400 lines",tm:"5 days"},
  {id:"g1",l:4,c:2,k:"auto",t:"Secret scanning",s:"Every commit",tm:"automatic"},
  {id:"g2",l:4,c:3,k:"auto",t:"SAST / SCA",s:"Every PR; blocks High",tm:"automatic"},

function Mermaid({code,id}){
  const ref=useRef(null); const [err,setErr]=useState(null);
  useEffect(()=>{ let on=true; if(!window.mermaid){setErr("Mermaid library not loaded (offline?)");return;}
    mermaid.initialize({startOnLoad:false,theme:"dark",securityLevel:"strict",flowchart:{htmlLabels:true}});
    mermaid.render(id,code).then(({svg})=>{ if(on&&ref.current) ref.current.innerHTML=svg; }).catch(e=>on&&setErr(String(e.message||e)));
    return ()=>{on=false}; },[code]);
  return html`<div className="mer">${err?html`<div className="small">Render error: ${err}</div>`:null}<div ref=${ref}></div></div>`;
}

 t1:["T1 Requirements",()=>html`<${Synth}/><${DataTable} t=${T1} numCols=${[3,4,5,6]}/>`],

 t5:["T5 Dev experience",()=>html`<${Synth}/><${DataTable} t=${T5} numCols=${[2,3,4,5,6]}/>`],

  ["A2","PR size, lines (T2, AI-led n=5 vs 4)","424.0","340","201.3","202.5","+110.7%","+67.9%"],["A2","Review turnaround h (T2)","26.0","24.0","20.5","21.0","+26.8%","+14.3%"],["A2","…excluding outlier Mobile S2","22.3","22.5","20.5","21.0","+8.5%","+7.1%"],["A2","Rework % (T2)","17.6","17.0","13.5","13.5","+30.4%","+25.9%"],
  ["A3","Regression person-days (T3, n=5 vs 4)","0.83","0.80","1.59","1.78","−47.7%","−54.9%"],["A3","Flaky test % (T3)","12.8","14.0","9.25","10.0","+38.4%","+40.0%"],["A3","Escaped defects (T3)","1.8","2.0","3.0","3.0","−40.0%","−33.3%"]]}/>
  <p className="small">Security by source (T4): AI-assisted 6 (2 escaped, 4 caught) vs human 4 (2 escaped, 2 caught). AI-assisted ≈45% of PRs (133.05 of 297) but 60% of findings; Checkout 15% of PRs (10.75 of 71) but 67% of findings. "AI-led sprint" = AI share ≥40%. Computed in Python; reproducible from the CSVs. Insights: (1) −30% clarification rounds, T1; (2) −26% regression in Catalog & Search, T3; (3) +68% PR size, +27% review, T2; (4) 60% of findings AI-sourced, T4; (5) flaky 14% → 22% in Mobile, T3.</p>
  <p className="small">Could mislead → pilot fix: small samples → 2 real releases, all pilot items; selection bias → same-team before/after; team confounding (T2 findings per PR look lower in AI-led sprints only because Checkout is low-AI and high-risk) → source label on every PR; correlation ≠ causation → matched work types and gates; outliers → medians alongside means.</p>`],

 reg:["Numbers register",()=>html`<p className="small">P = main page, A = Evidence vault.</p><${Table} cls="xs" head=${["Number","Where used","Type","Source or basis"]} rows=${REG.map(r=>[r[0],r[1],html`<${Tag} k=${r[2]}/>`,r[3]])}/>`],

  ["Six starting metrics","GIVEN","High"],["AI vs non-AI deltas (T1–T5)","ILLUSTRATIVE-SYNTHETIC","Low — method only"],["AI assistance raises PR size, review load and insecure suggestions without guardrails","INDUSTRY PATTERN","Medium (widely reported; no single study relied on)"],["Earlier automated security checks catch issues more cheaply","INDUSTRY PATTERN","Medium–high"],["Cost, hours saved, adoption, value","ASSUMPTION","Low–medium; replaced at Gate 3"],["Targets (9 → 6, 7 → 4, 60%)","ASSUMPTION","Medium; 7 → 4 confirmed only after 2 quarters"]]}/>
  <p className="small" style=${{lineHeight:1.7}}><b>Glossary.</b> AppSec: application security team · CISO: Chief Information Security Officer · DevEx: developer experience · FTE: full-time equivalent · IP: intellectual property · NFR: non-functional requirement · PO: product owner · PR: pull request (a proposed code change) · QA: quality assurance · SAST: static application security testing (scans our code) · SCA: software composition analysis (scans third-party libraries) · SDLC: software development life cycle · SSO: single sign-on · Flaky test: passes and fails without code changes · Regression test: re-checks old features still work · Lakh = 100,000; crore = 100 lakh.</p></div>`],
 mer:["Mermaid flows",()=>html`<div className="g2"><div><p><b style=${{color:"var(--tx)"}}>Before</b> <button className="btn" onClick=${()=>copy(MER_BEFORE)}>Copy</button></p><${Mermaid} code=${MER_BEFORE} id="merBefore"/><pre className="code" style=${{marginTop:"10px"}}>${"```mermaid\n"+MER_BEFORE+"\n```"}</pre></div>

  <div className="card"><h3 className="h">1 · Prompt (PO)</h3><p className="small">"Draft acceptance criteria for: a shopper applies one promo code to the cart. Include edge cases, security and non-functional criteria. Context: max one code per order; codes expire; minimum basket ₹999. No customer data included."</p></div>
  <div className="card"><h3 className="h">2 · Criteria (PO-approved)</h3><ul className="b"><li>Valid code reduces total once; second code rejected</li><li>Expired code shows a clear message</li><li>Basket below ₹999 → not applied</li><li>Code bound to the shopper's own cart (access control)</li><li>Apply responds in under 300 ms at peak (NFR)</li></ul><p className="small">PO fix: price recalculated server-side, never trusted from the client.</p></div>
  <div className="card"><h3 className="h">3 · Tests (QA-approved)</h3><ul className="b"><li>TC1 valid code → discount once</li><li>TC2 second code → rejected</li><li>TC3 basket ₹998 → not applied</li><li>TC4 other user's cart ID → 403</li><li>TC5 tampered client price → server total wins</li></ul><p className="small">Synthetic test data only.</p></div></div>`],

 scr:["3-minute script",()=>html`<div className="script">
  <p><b>Our ask is simple.</b> Approve a 30-lakh-rupee, 90-day pilot of governed, tool-agnostic AI assistance in three of our fourteen e-commerce teams, starting Monday 7 December. We are not buying one vendor or automating everything. We want to prove, safely, that AI makes delivery better, not just faster.</p>
  <p><b>Why now?</b> 38 percent of practitioners in the pilot already use AI tools, but unevenly and without shared rules. Generated code has failed security review. 7 high security findings escaped in two quarters. Regression still costs 9 person-days every release. And nobody can tell a claimed gain from a real one, because we count logins, not outcomes.</p>
  <p><b>What did we find?</b> On synthetic data — to show the method, not to prove results — AI-assisted stories needed 30 percent fewer clarification rounds, and AI test generation cut regression effort in one team by 26 percent. But AI-led coding sprints produced pull requests 68 percent larger and reviews 27 percent slower, and AI-assisted code sat behind 60 percent of security findings. Speed without guardrails moves risk into review and into production.</p>
  <p><b>So we recommend option three.</b> AI assists at three steps — drafting requirements, suggesting code, generating tests. Five human approvals stay: product owner, code owner, AppSec for every checkout and payment change, QA lead and release manager. Four automated checks stay mandatory: secret scanning, code and dependency scans, the regression gate and an audit log. No customer data, card data or secrets ever go into a prompt.</p>
  <p><b>The pilot teams</b> are Checkout and Payments, our highest-risk team; Catalog and Search; and Mobile App, our heaviest AI users. Checkout writes no AI-generated production code during the year-end sale freeze.</p>
  <p><b>We judge success on four indicators:</b> regression effort, escaped high findings, review turnaround and adoption with developer experience. Targets, under stated assumptions: regression from 9 to 6 person-days per release within twelve months, escaped highs from 7 to 4 per two quarters. The base case is 47.76 lakh rupees of net value a year at scale. The conservative case loses money — which is why we decide on real data at day 90.</p>
  <p><b>Ninety days is only two release cycles,</b> so we will show leading indicators and confirm security results later. Six stop rules let us pause any unsafe practice the same day.</p>
  <p><b>What we need:</b> VP Engineering and Finance to approve scope and budget by 27 November, and the CISO to approve the guardrails by 4 December. Our next decision is Friday 5 March 2027: scale, adjust or stop.</p></div>`],

/* ================= shell ================= */
const CH=[["p1","Summary & decision","D1"],["p2","As-is, analysis, gaps & recommendations","D1"],["p3","Options & best choice","D1"],["p4","To-be: human, AI, automation","D1"],["p5","Pilot teams & 90-day plan","D2"],["p6","Indicators, stop rules & decisions","D2"],["p7","How we used AI",""],["vault","Evidence vault",""]];
function App(){
  const [act,setAct]=useState("p1"); const [notes,setNotes]=useState(false); const [pr,setPr]=useState(0);
  useEffect(()=>{
    const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting) setAct(e.target.dataset.ch); }),{rootMargin:"-45% 0px -50% 0px"});
    document.querySelectorAll("section.ch").forEach(s=>io.observe(s));
    const sc=()=>{ const h=document.documentElement; setPr(h.scrollTop/((h.scrollHeight-h.clientHeight)||1)); };
    window.addEventListener("scroll",sc,{passive:true});
    return ()=>{io.disconnect();window.removeEventListener("scroll",sc);};
  },[]);
  const go=id=>{ const el=document.getElementById(id); if(el) el.scrollIntoView({behavior:"smooth"}); };
  useEffect(()=>{ const k=e=>{ const t=e.target.tagName; if(t==="INPUT"||t==="TEXTAREA") return;
      const i=CH.findIndex(c=>c[0]===act);
      if(e.key==="ArrowRight"||e.key==="PageDown"||e.key==="j"){e.preventDefault();go(CH[Math.min(i+1,CH.length-1)][0]);}
      if(e.key==="ArrowLeft"||e.key==="PageUp"||e.key==="k"){e.preventDefault();go(CH[Math.max(i-1,0)][0]);}
      if(e.key==="n"||e.key==="N") setNotes(v=>!v); };
    window.addEventListener("keydown",k); return ()=>window.removeEventListener("keydown",k); },[act]);
  let lastG=null;
  return html`<div className=${notes?"shownotes":""}>
   <nav className="rail">
    <div className="brand"><span>PS04</span> · Secure AI Engineering</div>
    <div className="brandsub">Tech Decision Pack · retail e-commerce</div>
    <div className="prog"><i style=${{width:(pr*100)+"%"}}></i></div>
    ${CH.map((c,i)=>{ const g=c[2]==="D1"?"D1 · Decision Brief":c[2]==="D2"?"D2 · 90-Day Plan":"Method & evidence"; const show=g!==lastG; lastG=g;
      return [show && html`<div className="grp" key=${"g"+i}>${g}</div>`,
        html`<div key=${c[0]} className=${"chap"+(act===c[0]?" on":"")} onClick=${()=>go(c[0])}><span className="d">${c[0]==="vault"?"A":i+1}</span><span className="tx">${c[1]}</span></div>`]; })}
    <div className="tools">
     <button className=${"tb"+(notes?" on":"")} onClick=${()=>setNotes(!notes)}>Notes</button>
     <button className="tb" onClick=${()=>window.print()}>PDF</button>
     <button className="tb" onClick=${()=>TABLES.forEach((t,k)=>setTimeout(()=>download(t.name+".csv",toCSV(t)),k*250))}>CSVs</button>
     <button className="tb" onClick=${()=>download(FILE.replace(/[\[\]]/g,"")+".html",SOURCE_HTML,"text/html")}>HTML</button>
    </div>
    <div className="keys">← → or J / K: move · N: presenter notes</div>
   </nav>
   <main><${P1}/><${P2}/><${P3}/><${P4}/><${P5}/><${P6}/><${P7}/><${Vault}/></main>
  </div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
